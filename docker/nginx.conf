# Serves the built web app and proxies /api and /health to the API, which shares this
# container's network namespace (compose: network_mode "service:api") and listens on loopback only.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    # Server-Sent Events must not be buffered.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /health/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $http_host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
