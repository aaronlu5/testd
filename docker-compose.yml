# Local single-host profile (Phase 2). Nothing here is exposed beyond 127.0.0.1.
#
#   docker compose up --build        start web (http://localhost:8080), API and worker
#   docker compose down              stop (data stays in the "runtime" volume)
#
# The API refuses non-loopback binding because real authentication does not exist yet, so the web
# container joins the API's network namespace and proxies /api to 127.0.0.1:3000. The published
# port is therefore declared on "api". Copy .env.example to .env for settings and secrets.
name: test-platform

# Container paths and ports are fixed here so a copied .env (which uses host-style paths) cannot
# override them: `environment` wins over `env_file`.
x-platform-env: &platform-env
  TEST_PLATFORM_RUNTIME_DIR: /data/runtime
  TEST_PLATFORM_DEFINITIONS_DIR: /data/definitions
  TEST_PLATFORM_CONFIG_DIR: /data/config
  TEST_PLATFORM_API_HOST: 127.0.0.1
  TEST_PLATFORM_API_PORT: '3000'
  TEST_PLATFORM_WORKER_HEALTH_PORT: '3001'
  TEST_PLATFORM_MOCK_API_PORT: '3002'
  TEST_PLATFORM_MOCK_API_PUBLIC_URL: ${TEST_PLATFORM_MOCK_API_PUBLIC_URL:-http://127.0.0.1:3002}
  TEST_PLATFORM_LOG_LEVEL: ${TEST_PLATFORM_LOG_LEVEL:-info}
  TEST_PLATFORM_ENVIRONMENTS_FILE: ${TEST_PLATFORM_ENVIRONMENTS_FILE:-environments.local.json}

services:
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    # Optional file of TEST_PLATFORM_SECRET_<NAME>=value lines; Git-ignored, never baked into an image.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *platform-env
      TEST_PLATFORM_API_CORS_ORIGINS: http://localhost:${TEST_PLATFORM_WEB_PORT:-8080},http://127.0.0.1:${TEST_PLATFORM_WEB_PORT:-8080}
    ports:
      - '127.0.0.1:${TEST_PLATFORM_WEB_PORT:-8080}:8080'
    volumes:
      - runtime:/data/runtime
      - ./definitions:/data/definitions
      # Writable: the Environments page saves config/environments.local.json. The worker only reads it.
      - ./config:/data/config
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy } # the API applies migrations first
    env_file:
      - path: .env
        required: false
    environment:
      <<: *platform-env
      # Listen on all container interfaces; the host-side binding below decides who can reach it.
      TEST_PLATFORM_MOCK_API_HOST: 0.0.0.0
    # The Mock API server the system under test calls. Published on the host's loopback by default;
    # set TEST_PLATFORM_MOCK_API_BIND=0.0.0.0 (it has no authentication) to reach it from elsewhere.
    ports:
      - '${TEST_PLATFORM_MOCK_API_BIND:-127.0.0.1}:3002:3002'
    volumes:
      - runtime:/data/runtime
      - ./config:/data/config:ro
    # Secrets edited on the Secrets page are saved by the API into the shared runtime volume and
    # read from there. A read-only file mount like the line below would hide that file, so use it
    # only when you manage secrets by hand and not in the UI:
    #   - ./runtime/secrets.local.json:/data/runtime/secrets.local.json:ro
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_BASE_URL: http://localhost:${TEST_PLATFORM_WEB_PORT:-8080}
    restart: unless-stopped
    network_mode: 'service:api'
    depends_on:
      api: { condition: service_healthy }

volumes:
  # SQLite (WAL), artifacts and logs. A named volume, not a bind mount, because SQLite needs a
  # real Linux file system shared by the api and worker containers.
  runtime:
